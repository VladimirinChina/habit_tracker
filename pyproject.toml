[project]
name = "habit-tracker"
version = "0.1.0"
description = ""
authors = [
    {name = "vladimir",email = "vladimirinchina@gmail.com"}
]
requires-python = "^3.14"
dependencies = [
    "django (>=6.1.2,<7.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "gunicorn (>=26.2.0,<27.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.10.1,<27.0.0)",
    "flake8 (>=7.4.1,<8.0.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "coverage (>=7.17.0,<8.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "djangorestframework-stubs (>=3.18.1,<4.0.0)",
    "django-stubs (>=6.1.2,<7.0.0)",
    "celery-types (>=0.26.0,<0.27.0)"
]


[tool.black]
line_length = 119
exclude = '''
/(
    \.git
  | \.venv
)/
'''


[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
python_version = "3.14"
# mypy_path = "src"
disallow_untyped_defs = true
warn_return_any = true
exclude = ['tests', '.venv', 'venv', 'migrations/']
explicit_package_bases = true
namespace_packages = true
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[[tool.mypy.overrides]]
module = ["django_filters.*", "celery.*"]
ignore_missing_imports = true


[tool.poetry]
package-mode = false

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests.py",
    "manage.py",
    "config/asgi.py",
    "config/wsgi.py",
    ".venv/*",
]

[tool.coverage.report]
show_missing = true