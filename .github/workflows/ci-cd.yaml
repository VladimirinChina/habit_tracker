name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop]

env:
  NGINX_PORT: "8080"

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: habits
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      POSTGRES_DB: habits
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://localhost:6379/0
      TELEGRAM_BOT_TOKEN: dummy-token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --no-root

      - name: Lint
        run: |
          poetry run black --check .
          poetry run isort --check-only .
          poetry run flake8
          poetry run mypy .

      - name: Tests with coverage
        run: |
          poetry run coverage run manage.py test
          poetry run coverage report --fail-under=80

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name in lowercase
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on push events)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build
    # после слияния в develop ветку feature/docker-ci-cd из условия можно убрать
    if: >-
      github.event_name == 'push' &&
      (github.ref_name == 'develop' || github.ref_name == 'feature/docker-ci-cd')
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Image name in lowercase
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Prepare production .env
        run: |
          cat > .env.prod << 'EOF'
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DEBUG=False
          ALLOWED_HOSTS=${{ secrets.SSH_HOST }},localhost
          CORS_ALLOWED_ORIGINS=http://${{ secrets.SSH_HOST }}:${{ env.NGINX_PORT }}
          CSRF_TRUSTED_ORIGINS=http://${{ secrets.SSH_HOST }}:${{ env.NGINX_PORT }}
          POSTGRES_DB=habits
          POSTGRES_USER=habits
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          NGINX_PORT=${{ env.NGINX_PORT }}
          EOF

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.prod.yaml,nginx/nginx.conf,.env.prod"
          target: "habit_tracker"

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NGINX_PORT: ${{ env.NGINX_PORT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: APP_IMAGE,GHCR_USER,GHCR_TOKEN,NGINX_PORT
          script_stop: true
          script: |
            cd habit_tracker
            mv -f .env.prod .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.prod.yaml pull
            docker compose -f docker-compose.prod.yaml up -d --remove-orphans
            docker compose -f docker-compose.prod.yaml restart nginx
            docker image prune -f
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null "http://localhost:${NGINX_PORT}/api/schema/"; then
                echo "Application is up"
                exit 0
              fi
              sleep 3
            done
            docker compose -f docker-compose.prod.yaml logs --tail=50 app nginx
            exit 1